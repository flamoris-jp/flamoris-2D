name: Native Shell Boundary

on:
  pull_request:
    branches:
      - main
    paths:
      - "product/native/**"
      - "product/product-host/**"
      - "product/src/**"
      - "product/tests/product-host.test.js"
      - "product/tests/native-*.test.js"
      - "product/tests/production-manifest.test.js"
      - "product/package.json"
      - ".github/workflows/native-shell-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  windows-native-boundary:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FLAMORIS_RENDER_FIXTURE_DIR: ${{ github.workspace }}/out/render-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          source-url: https://nuget.pkg.github.com/flamoris-jp/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate FLAMORIS package source
        shell: pwsh
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source flamoris --configfile NuGet.config --username flamoris-jp --password $env:NUGET_AUTH_TOKEN --store-password-in-clear-text

      - name: Install locked Product and MCP test dependencies
        run: npm ci --prefix product --workspaces=false --ignore-scripts

      - name: Product Host protocol tests
        run: node --test product/tests/product-host.test.js product/tests/native-mesh-host.test.js product/tests/native-document-host.test.js product/tests/native-source-host.test.js product/tests/native-render-projection.test.js product/tests/native-rig-host.test.js product/tests/native-timeline-host.test.js product/tests/native-export-host.test.js product/tests/native-key-state-host.test.js product/tests/native-live-mcp.test.js product/tests/production-manifest.test.js

      - name: Build native solution
        run: dotnet build product/native/Flamoris2D.Native.sln -c Release

      - name: Prepare pinned LGPL encoder for native integration
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'native-ffmpeg.zip'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-14-13-17/ffmpeg-N-126556-g639ee84952-win64-lgpl-shared.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '526562B18482314EA17110B7E5A0CFBB701815DCBA66156817B7EEF4662A57F8') { throw 'Encoder archive checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'native-ffmpeg'
          Expand-Archive $archive $destination
          $encoder = (Get-ChildItem $destination -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          "FLAMORIS_TEST_FFMPEG=$encoder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: C# client and crash-invalidation tests
        run: dotnet run --project product/native/tests/Flamoris2D.ProductHost.Client.Tests -c Release --no-build -- product/product-host/main.mjs

      - name: Publish native candidate
        run: dotnet publish product/native/src/Flamoris2D.App -c Release -r win-x64 --self-contained true -o out/native-win-x64

      - name: Include versioned runtimes and upstream notices
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'out/native-win-x64'
          $runtime = New-Item -ItemType Directory -Path (Join-Path $package 'runtime') -Force
          Copy-Item (Get-Command node).Source (Join-Path $runtime 'node.exe')
          if ((& (Join-Path $runtime 'node.exe') --version) -ne 'v24.21.0') { throw 'Unexpected bundled Node version' }
          Invoke-WebRequest 'https://raw.githubusercontent.com/nodejs/node/v24.21.0/LICENSE' -OutFile (Join-Path $runtime 'LICENSE.txt')
          $ffmpegRoot = Split-Path (Split-Path $env:FLAMORIS_TEST_FFMPEG)
          Copy-Item $ffmpegRoot (Join-Path $package 'ffmpeg') -Recurse
          Copy-Item 'product/native/THIRD-PARTY-NOTICES.md' $package
          Copy-Item 'docs/native-production-workflow.md' (Join-Path $package 'README.md')
          Get-ChildItem $package -File -Recurse | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.FullName.Substring($package.Length + 1) } | Set-Content (Join-Path $env:RUNNER_TEMP 'native-sha256.txt')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'native-sha256.txt') (Join-Path $package 'SHA256SUMS.txt')

      - name: Packaged WPF production smoke without developer runtimes on PATH
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'out/native-win-x64'
          $env:FLAMORIS_NODE_PATH = $null
          $env:FLAMORIS_TEST_FFMPEG = Join-Path $package 'ffmpeg/bin/ffmpeg.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $process = Start-Process (Join-Path $package 'Flamoris2D.exe') -ArgumentList '--smoke-test' -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Packaged WPF smoke failed: $($process.ExitCode)" }

      - name: Upload native candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: flamoris2d-native-production-candidate-win-x64
          path: out/native-win-x64
          if-no-files-found: error
          retention-days: 3
