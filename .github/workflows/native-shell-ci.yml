name: Native Shell Boundary

on:
  pull_request:
    branches:
      - main
    paths:
      - "product/native/**"
      - "product/product-host/**"
      - "product/src/**"
      - "product/tests/product-host.test.js"
      - "product/tests/native-mesh-host.test.js"
      - "product/package.json"
      - ".github/workflows/native-shell-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-boundary:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FLAMORIS_RENDER_FIXTURE_DIR: ${{ github.workspace }}/out/render-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install pinned Product source decoder
        run: npm install --prefix product --workspaces=false --omit=dev --ignore-scripts --package-lock=false

      - name: Product Host protocol tests
        run: node --test product/tests/product-host.test.js product/tests/native-mesh-host.test.js product/tests/native-document-host.test.js product/tests/native-source-host.test.js product/tests/native-render-projection.test.js product/tests/native-rig-host.test.js product/tests/native-timeline-host.test.js product/tests/native-export-host.test.js product/tests/native-key-state-host.test.js

      - name: Build native solution
        run: dotnet build product/native/Flamoris2D.Native.sln -c Release

      - name: Prepare pinned LGPL encoder for native integration
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'native-ffmpeg.zip'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-14-13-17/ffmpeg-N-126556-g639ee84952-win64-lgpl-shared.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '526562B18482314EA17110B7E5A0CFBB701815DCBA66156817B7EEF4662A57F8') { throw 'Encoder archive checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'native-ffmpeg'
          Expand-Archive $archive $destination
          $encoder = (Get-ChildItem $destination -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          "FLAMORIS_TEST_FFMPEG=$encoder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: C# client and crash-invalidation tests
        run: dotnet run --project product/native/tests/Flamoris2D.ProductHost.Client.Tests -c Release --no-build -- product/product-host/main.mjs

      - name: WPF XAML and Product Host smoke launch
        run: dotnet run --project product/native/src/Flamoris2D.App -c Release --no-build -- --smoke-test

      - name: Publish native candidate
        run: dotnet publish product/native/src/Flamoris2D.App -c Release -r win-x64 --self-contained false -o out/native-win-x64

      - name: Upload native candidate
        uses: actions/upload-artifact@v4
        with:
          name: flamoris2d-native-production-candidate-win-x64
          path: out/native-win-x64
          if-no-files-found: error
