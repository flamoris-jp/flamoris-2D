name: Native Shell Boundary

on:
  pull_request:
    branches:
      - main
    paths:
      - "product/native/**"
      - "product/product-host/**"
      - "product/src/**"
      - "product/tests/product-host.test.js"
      - "product/tests/native-*.test.js"
      - "product/tests/production-manifest.test.js"
      - "product/package.json"
      - "product/package-lock.json"
      - "LICENSE"
      - ".github/workflows/native-shell-ci.yml"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  windows-native-boundary:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FLAMORIS_RENDER_FIXTURE_DIR: ${{ github.workspace }}/out/render-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install locked Product and MCP test dependencies
        run: npm ci --prefix product --workspaces=false --ignore-scripts

      - name: Product Host protocol tests
        run: node --test product/tests/product-host.test.js product/tests/native-mesh-host.test.js product/tests/native-document-host.test.js product/tests/native-source-host.test.js product/tests/native-render-projection.test.js product/tests/native-rig-host.test.js product/tests/native-timeline-host.test.js product/tests/native-export-host.test.js product/tests/native-key-state-host.test.js product/tests/native-live-mcp.test.js product/tests/production-manifest.test.js

      - name: Verify native conformance fixtures against Product JS
        run: |
          node product/native/tests/check-temporal-conformance.mjs
          node product/native/tests/check-project-conformance.mjs
          node product/native/tests/check-session-conformance.mjs
          node product/native/tests/check-document-conformance.mjs
          node product/native/tests/check-source-ingest-conformance.mjs
          node product/native/tests/check-source-codec-conformance.mjs
          node product/native/tests/check-psd-codec-conformance.mjs
          node product/native/tests/check-live-catalog.mjs
          node product/native/tests/check-render-plan-conformance.mjs
          node product/native/tests/check-mesh-authoring-conformance.mjs

      - name: Build native solution
        run: dotnet build product/native/Flamoris2D.Native.sln -c Release

      - name: Source codecs and native session adapters
        run: |
          dotnet run --project product/native/tests/Flamoris2D.Source.Codecs.Tests -c Release --no-build -- product/native/tests/source-codec-conformance.json product/native/tests/psd-codec-conformance.json
          dotnet run --project product/native/tests/Flamoris2D.Session.Tests -c Release --no-build -- product/native/tests/source-codec-conformance.json product/native/tests/psd-codec-conformance.json

      - name: Build portable Windows candidate
        shell: pwsh
        run: |
          ./product/packaging/publish-windows.ps1
          "FLAMORIS_TEST_FFMPEG=$env:GITHUB_WORKSPACE/artifacts/package/Flamoris2D-win-x64/ffmpeg/bin/ffmpeg.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: C# client and crash-invalidation tests
        env:
          FLAMORIS_TEST_BRIDGE: ${{ github.workspace }}/artifacts/package/Flamoris2D-win-x64/mcp/Flamoris.Mcp.Bridge.exe
        run: dotnet run --project product/native/tests/Flamoris2D.ProductHost.Client.Tests -c Release --no-build -- product/product-host/main.mjs

      - name: Packaged WPF production smoke without developer runtimes on PATH
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'artifacts/package/Flamoris2D-win-x64'
          $env:FLAMORIS_NODE_PATH = $null
          $env:FLAMORIS_TEST_FFMPEG = Join-Path $package 'ffmpeg/bin/ffmpeg.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $process = Start-Process (Join-Path $package 'Flamoris2D.exe') -ArgumentList '--smoke-test' -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Packaged WPF smoke failed: $($process.ExitCode)" }

      - name: Upload native candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: flamoris2d-native-production-candidate-win-x64
          path: artifacts/package/Flamoris2D-win-x64
          if-no-files-found: error
          retention-days: 3
