name: Windows Desktop Package

on:
  pull_request:
    branches:
      - main
    paths:
      - "product/desktop/**"
      - "product/src/**"
      - "product/index.html"
      - "product/package.json"
      - "product/package-lock.json"
      - "product/scripts/release-hygiene.mjs"
      - "LICENSE"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-desktop-package.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-desktop-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Desktop dependencies
        run: npm ci

      - name: Product tests on Windows
        run: npm test

      - name: Package Windows Desktop app
        run: npm run desktop:pack
