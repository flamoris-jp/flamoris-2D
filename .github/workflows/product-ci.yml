name: Product CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "product/**"
      - "package.json"
      - ".github/workflows/product-ci.yml"


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install locked Product and MCP test dependencies
        run: npm ci --prefix product --workspaces=false --ignore-scripts

      - name: Deterministic Product unit tests
        run: npm test
