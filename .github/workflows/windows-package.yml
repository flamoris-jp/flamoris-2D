name: Windows Portable Package

on:
  pull_request:
    branches:
      - main
    paths:
      - "product/native/**"
      - "product/packaging/**"
      - "test/packaging/**"
      - "docs/windows-packaging.md"
      - "docs/native-production-workflow.md"
      - "LICENSE"
      - ".github/workflows/windows-package.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-native-boundary:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FLAMORIS_RENDER_FIXTURE_DIR: ${{ github.workspace }}/out/render-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Stage production test fixtures
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'product/native/tests/fixtures/production'
          New-Item -ItemType Directory -Force -Path $env:FLAMORIS_RENDER_FIXTURE_DIR | Out-Null
          foreach ($name in @('production-render-projections.json', 'production-render-textures.json', 'native-production-source.psd', 'native-production-source.flimg')) {
            $fixture = Join-Path $source $name
            if (!(Test-Path -LiteralPath $fixture -PathType Leaf)) { throw "Required production test fixture missing: $fixture" }
            Copy-Item -LiteralPath $fixture -Destination $env:FLAMORIS_RENDER_FIXTURE_DIR
          }

      - name: Build native solution
        run: dotnet build product/native/Flamoris2D.Native.sln -c Release

      - name: Native C++ conformance and authority tests
        run: ctest --test-dir product/native/src/Flamoris2D.Core.Interop/obj/native-x64 -C Release --output-on-failure

      - name: Source codecs and native session adapters
        run: |
          dotnet run --project product/native/tests/Flamoris2D.Source.Codecs.Tests -c Release --no-build -- product/native/tests/source-codec-conformance.json product/native/tests/psd-codec-conformance.json
          dotnet run --project product/native/tests/Flamoris2D.Session.Tests -c Release --no-build -- product/native/tests/source-codec-conformance.json product/native/tests/psd-codec-conformance.json

      - name: Portable archive integrity contracts
        shell: pwsh
        run: |
          ./test/packaging/portable-package.Tests.ps1
          ./test/packaging/ffmpeg-runtime.Tests.ps1

      - name: Build portable Windows candidate
        shell: pwsh
        run: |
          ./product/packaging/publish-windows.ps1
          "FLAMORIS_TEST_FFMPEG=$env:GITHUB_WORKSPACE/artifacts/windows/FLAMORIS-2D-win-x64/ffmpeg/bin/ffmpeg.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Native desktop/MCP client tests
        env:
          FLAMORIS_TEST_BRIDGE: ${{ github.workspace }}/artifacts/windows/FLAMORIS-2D-win-x64/mcp/Flamoris.Mcp.Bridge.exe
        run: dotnet run --project product/native/tests/Flamoris2D.Native.Client.Tests -c Release --no-build -- product/native/tests

      - name: Packaged WPF production smoke without developer runtimes on PATH
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows/FLAMORIS-2D-win-x64'
          $env:FLAMORIS_TEST_FFMPEG = Join-Path $package 'ffmpeg/bin/ffmpeg.exe'
          $env:PATH = "$env:SystemRoot\\System32;$env:SystemRoot"
          $process = Start-Process (Join-Path $package 'Flamoris2D.exe') -ArgumentList '--smoke-test' -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Packaged WPF smoke failed: $($process.ExitCode)" }

      - name: Upload native candidate
        uses: actions/upload-artifact@v4
        with:
          name: FLAMORIS-2D-win-x64
          path: |
            artifacts/windows/FLAMORIS-2D-win-x64.zip
            artifacts/windows/FLAMORIS-2D-win-x64.inventory.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
